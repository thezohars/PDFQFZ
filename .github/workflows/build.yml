name: Build PDFQFZ

on:
  push:
    branches: [ master ]
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: windows-latest # 使用 Windows 环境

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2 # 配置 MSBuild 环境

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2 # 配置 NuGet 包管理器

    - name: Restore NuGet packages
      run: nuget restore PDFQFZ.sln # 还原项目依赖

    - name: Build solution
      run: msbuild PDFQFZ.sln /p:Configuration=Release # 编译 Release 版本

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PDFQFZ-Build
        path: PDFQFZ\bin\Release\ # 上传编译好的文件
